version: '3.8'
services:
  postgres-db:
    image: postgres:15-alpine
    container_name: hotel-eclipse-db
    environment:
      POSTGRES_DB: hotel_eclipse_db
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
