spring.application.name=eclipse-hotel-reservations

#Configuração da Porta
server.port=8080

# Configurações de Conexão do Banco de Dados
spring.datasource.url=jdbc:postgresql://localhost:5433/hotel_eclipse_db
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=update

# Assinatura do Token
api.security.token.issuer=eclipse-hotel

