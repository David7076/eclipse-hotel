spring:
  application:
    name: eclipse-hotel-reservations

  # Configurações de Conexão do Banco de Dados
  datasource:
    url: jdbc:postgresql://localhost:5433/hotel_eclipse_db
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Configurações do Hibernate / JPA
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

# Configuração da Porta
server:
  port: 8080

# Assinatura do Token
api:
  security:
    token:
      issuer: eclipse-hotel